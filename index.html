<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Recipe Finder</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>🍳 Recipe Finder</h1>

        <p class="subtitle">
            Find delicious recipes from around the world
        </p>


        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Enter food name..."
            >

            <button onclick="searchRecipe()">
                Search
            </button>

        </div>


        <div id="recipes"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
